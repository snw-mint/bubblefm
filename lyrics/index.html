<body>
  <header class="home-header floating-header">
    <div class="header-brand-group">
      <a href="/index.html" class="logo-container">
        <img src="/logo.svg" alt="BubbleFM Logo" class="logo-icon" />
        <span class="logo-text">
          <span class="brand-bubble">Bubble</span>
          <span class="brand-fm">FM</span>
        </span>
      </a>
      <div class="header-divider"></div>
      <nav class="header-nav">
        <a href="/index.html" class="nav-link">Charts</a>
        <a href="/match/" class="nav-link">Match</a>
        <a href="/lyrics/" class="nav-link active">
          <span class="nav-badge-container">
            Lyrics
            <span class="nav-badge-new">new</span>
          </span>
        </a>
      </nav>
    </div>
    <div class="header-actions">
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme"></button>
      <a href="https://buymeacoffee.com/snw.mint" target="_blank" rel="noopener noreferrer" class="bmac-link-btn"
        aria-label="Buy Me a Coffee" title="Buy Me a Coffee">
        <animate-icons name="coffee" size="24"></animate-icons>
      </a>
      <a href="https://github.com/snw-mint/bubblefm" target="_blank" rel="noopener noreferrer" class="github-link-btn"
        aria-label="GitHub Repository" title="GitHub Repository">
        <animate-icons name="github" size="24"></animate-icons>
      </a>
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
        <animate-icons name="menu" size="24"></animate-icons>
      </button>
    </div>
  </header>

  <main class="main-container">
    <section class="landing-card">
      <h1 class="landing-title">Share your favorite song <span class="highlight-serif">Lyrics</span></h1>
      <p class="landing-subtitle">
        Search for any song to select your favorite lines and create aesthetic cards.
      </p>

      <form id="form-lyrics" class="username-form">
        <div class="input-group">
          <div class="input-with-icon">
            <span class="input-icon">
              <animate-icons name="disc-3" size="20"></animate-icons>
            </span>
            <input type="text" id="lyricsInput" placeholder="Song or artist name..." autocomplete="off" required />
          </div>
          <button type="submit" id="btnSearchLyrics" class="btn-primary">Search Lyrics</button>
        </div>
      </form>

      <p id="mensagemErro" class="error-message"></p>
    </section>
  </main>

  <footer class="app-footer">
    <div class="footer-info">
      <span class="info-line-1">
        ©
        <span id="currentYear">2026</span>
        BubbleFM.
      </span>
      <span class="separator">|</span>
      <span class="info-line-3">
        by
        <a href="https://github.com/snw-mint/" target="_blank" rel="noopener noreferrer">Snow Mint</a>
      </span>
    </div>
    <div class="footer-links">
      <a href="https://buymeacoffee.com/snw.mint" target="_blank" rel="noopener noreferrer">Buy Me a Coffee</a>

      <span class="dot">•</span>
      <span class="versao">v1.0.0</span>
    </div>
  </footer>

  <script type="module" src="/lyrics/lyrics.js"></script>
</body>

</html>
