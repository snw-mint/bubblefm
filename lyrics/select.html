<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Select Lyrics - BubbleFM</title>
  <meta name="title" content="Select Lyrics - BubbleFM" />
  <meta name="description"
    content="Select up to 5 lines from the song lyrics to create your custom card." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
  <header class="home-header floating-header">
    <div class="header-brand-group">
      <a href="/index.html" class="logo-container">
        <img src="/logo.svg" alt="BubbleFM Logo" class="logo-icon" />
        <span class="logo-text">
          <span class="brand-bubble">Bubble</span>
          <span class="brand-fm">FM</span>
        </span>
      </a>
    </div>
    <div class="header-actions">
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme"></button>
      <a href="https://buymeacoffee.com/snw.mint" target="_blank" rel="noopener noreferrer" class="bmac-link-btn"
        aria-label="Buy Me a Coffee" title="Buy Me a Coffee">
        <animate-icons name="coffee" size="24"></animate-icons>
      </a>
      <a href="https://github.com/snw-mint/bubblefm" target="_blank" rel="noopener noreferrer" class="github-link-btn"
        aria-label="GitHub Repository" title="GitHub Repository">
        <animate-icons name="github" size="24"></animate-icons>
      </a>
    </div>
  </header>

  <main class="main-container">
    <div class="lyrics-select-container">
      <div class="lyrics-sheet-card">
        <div class="lyrics-sheet-header">
          <div class="lyrics-track-info-group">
            <img id="trackCoverThumb" src="https://e-cdns-images.dzcdn.net/images/cover/b4ea39ef67aa16301aa3752e805562d9/250x250-000000-80-0-0.jpg" alt="Track Cover" class="lyrics-track-thumb" draggable="false" />
            <div class="lyrics-track-meta">
              <h2 id="trackTitleDisplay" class="lyrics-track-name">Born This Way</h2>
              <p class="lyrics-track-by">by <span id="trackArtistDisplay" class="lyrics-card-artist-name">Lady Gaga</span></p>
            </div>
          </div>
          <button type="button" id="btnTranslateToggle" class="lyrics-translate-btn">
            <animate-icons name="languages" size="18"></animate-icons>
            <span>Translate</span>
          </button>
        </div>

        <div class="lyrics-select-instruction">
          <span>Tap lines to select (max 5):</span>
          <span class="lyrics-count-badge" id="lyricsCountDisplay">0 / 5</span>
        </div>

        <div class="lyrics-lines-wrapper" id="lyricsLinesWrapper">
          <div class="lyric-line-item skeleton" style="height: 48px; opacity: 0.6;"></div>
          <div class="lyric-line-item skeleton" style="height: 48px; opacity: 0.5;"></div>
          <div class="lyric-line-item skeleton" style="height: 48px; opacity: 0.4;"></div>
          <div class="lyric-line-item skeleton" style="height: 48px; opacity: 0.3;"></div>
          <div class="lyric-line-item skeleton" style="height: 48px; opacity: 0.2;"></div>
        </div>

        <div class="lyrics-credits">
          <span>Lyrics provided by <a href="https://lrclib.net" target="_blank" rel="noopener noreferrer">LRCLIB</a></span>
        </div>
      </div>

      <button type="button" id="btnContinue" class="btn-primary" style="width: 100%; max-width: 320px;">
        Continue
      </button>

      <a href="./result.html" class="lyrics-retry-btn">
        <animate-icons name="chevron-left" size="18"></animate-icons>
        <span>Back to results</span>
      </a>
    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-info">
      <span class="info-line-1">
        ©
        <span id="currentYear">2026</span>
        BubbleFM.
      </span>
      <span class="separator">|</span>
      <span class="info-line-3">
        by
        <a href="https://github.com/snw-mint/" target="_blank" rel="noopener noreferrer">Snow Mint</a>
      </span>
    </div>
    <div class="footer-links">
      <a href="https://buymeacoffee.com/snw.mint" target="_blank" rel="noopener noreferrer">Buy Me a Coffee</a>
      <span class="dot">•</span>
      <a href="https://github.com/snw-mint/bubblefm" target="_blank" rel="noopener noreferrer">Star on GitHub</a>
      <span class="dot">•</span>
      <a href="/privacy.html">Privacy Policy</a>
      <span class="dot">•</span>
      <a href="/terms.html">Terms of Use</a>
      <span class="dot">•</span>
      <a href="https://github.com/snw-mint/bubblefm/issues" target="_blank" rel="noopener noreferrer">Issues</a>
      <span class="dot">•</span>
      <span class="versao">v1.0.0</span>
    </div>
  </footer>

  <script type="module" src="/lyrics/lyrics.js"></script>
</body>

</html>
