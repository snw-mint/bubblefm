    <style>
      .match-headers-wrapper {
        display: flex;
        width: 100%;
        margin-bottom: 2rem;
      }
      .match-headers-wrapper {
        display: flex;
        width: 100%;
        max-width: 1200px;
        margin: -70px auto 0.5rem auto;
        padding: 0 1rem;
        position: relative;
        z-index: 2;
      }
      .match-user-profile {
        flex: 1;
        width: 50%;
      }
      .match-user-profile.user2 .user-profile-container {
        flex-direction: row-reverse;
        text-align: right;
      }
      .match-user-profile.user2 .user-info-details {
        align-items: flex-end;
      }
      .match-user-profile.user2 .user-display-name {
        text-align: right;
      }
      .match-user-profile.user2 .stats-cards-container {
        justify-content: flex-end;
      }
      .match-user-profile.user2 .stat-card {
        align-items: flex-end;
      }
      .tastometer-container {
        position: absolute;
        left: 50%;
        top: 10px;
        transform: translate(-50%, 0);
        width: 130px;
        height: 130px;
        background-color: var(--color-bg);
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        border: 4px solid var(--color-bg);
      }
      .tastometer-container svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
        position: absolute;
        top: 0;
        left: 0;
      }
      .tastometer-container circle {
        fill: none;
        stroke-width: 8;
      }
      .tastometer-container circle.bg {
        stroke: var(--color-neutral-700);
      }
      .tastometer-container circle.progress {
        stroke: #3b82f6;
        stroke-linecap: round;
        stroke-dasharray: 282.74;
        stroke-dashoffset: 282.74;
        transition: stroke-dashoffset 1.5s cubic-bezier(0.1, 0.7, 0.1, 1);
      }
      .tastometer-container .percentage-text {
        font-size: 2rem;
        font-weight: 800;
        color: var(--color-text);
        z-index: 2;
      }

      @media (max-width: 768px) {
        .match-headers-wrapper {
          flex-direction: column;
          align-items: center;
          margin-top: -50px;
          gap: 1.5rem;
        }
        .match-user-profile {
          width: 100%;
        }
        .match-user-profile.user1 .user-profile-container {
          flex-direction: row !important;
          align-items: center !important;
          justify-content: flex-start !important;
          padding: 0 10px;
        }
        .match-user-profile.user2 .user-profile-container {
          flex-direction: row-reverse !important;
          align-items: center !important;
          justify-content: flex-start !important;
          text-align: right !important;
          padding: 0 10px;
        }
        .match-user-profile .user-profile-image {
          width: 80px;
          height: 80px;
          margin-top: 0;
          flex-shrink: 0;
        }
        .tastometer-container {
          position: relative;
          left: auto;
          top: auto;
          transform: none;
          width: 120px;
          height: 120px;
          margin: 0.5rem 0;
        }
        .tastometer-container .percentage-text {
          font-size: 1.5rem;
        }
        .match-user-profile .user-info-details {
          width: auto;
          margin-top: 0;
          margin-left: 15px;
          flex: 1;
        }
        .match-user-profile.user2 .user-info-details {
          margin-left: 0;
          margin-right: 15px;
        }
        .match-user-profile.user1 .user-info-details {
          align-items: flex-start !important;
        }
        .match-user-profile.user2 .user-info-details {
          align-items: flex-end !important;
        }
        .match-user-profile .user-display-name {
          font-size: 1.3rem;
          margin-top: 0;
          word-break: break-word;
        }
        .match-user-profile .stats-cards-container {
          flex-direction: row !important;
          gap: 15px;
          margin-top: 8px;
          width: 100%;
        }
        .match-user-profile.user1 .stats-cards-container {
          align-items: center !important;
          justify-content: flex-start !important;
        }
        .match-user-profile.user2 .stats-cards-container {
          align-items: center !important;
          justify-content: flex-end !important;
        }
      }
    </style>
